<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habit Coin Flip Ritual</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel&display=swap');

  body {
    margin: 0; padding: 0;
    font-family: 'Cinzel', serif;
    background: linear-gradient(to bottom right, #1a0000, #331100, #552200);
    color: #fff3e0;
    height: 100vh;
    display: flex; justify-content: center; align-items: center;
    text-align: center;
    overflow: hidden;
    padding: 20px;
  }

  .container {
    background: rgba(51, 17, 0, 0.85);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 20px #ff6600, 0 0 40px #cc3300;
    max-width: 450px;
    width: 100%;
  }

  h1 {
    font-size: 2.5rem;
    color: #ffcc66;
    text-shadow: 0 0 8px #ff6600;
    margin-bottom: 10px;
  }

  .sacred-text {
    font-style: italic;
    font-size: 1.1rem;
    margin-bottom: 20px;
    color: #ffb84d;
  }

  .habits-display {
    display: flex;
    justify-content: space-around;
    margin-bottom: 25px;
    font-size: 1.5rem;
    font-weight: 600;
    color: #ff9933;
  }

  .habit-emoji {
    font-size: 3rem;
    user-select: none;
  }

  button {
    background: linear-gradient(to right, #ff6600, #ff3300);
    border: none;
    padding: 15px 40px;
    color: #fff8e6;
    font-size: 1.2rem;
    font-weight: 700;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 0 12px #ff9900;
    transition: transform 0.2s ease;
  }

  button:hover {
    transform: scale(1.05);
  }

  .flip-area {
    margin-top: 30px;
    font-size: 4rem;
    height: 80px;
    user-select: none;
  }

  /* Flip animation */
  @keyframes flip-spin {
    0% {
      transform: rotateY(0deg);
    }
    100% {
      transform: rotateY(1080deg); /* 3 full spins */
    }
  }

  .flipping {
    animation: flip-spin 3s ease forwards;
  }

  .result-text {
    margin-top: 20px;
    font-size: 1.5rem;
    font-weight: 700;
    color: #ffb84d;
    min-height: 2em;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>The Sacred Habit Coin Flip</h1>
    <div class="sacred-text">
      Behold the dual paths before you. Which will fate choose?
    </div>
    <div class="habits-display">
      <div id="habit1" class="habit-emoji">🔥</div>
      <div id="habit2" class="habit-emoji">🌊</div>
    </div>

    <button id="flipBtn">Flip</button>

    <div class="flip-area" id="flipArea">💲</div>
    <div class="result-text" id="resultText"></div>
  </div>

<script>
  const flipBtn = document.getElementById('flipBtn');
  const flipArea = document.getElementById('flipArea');
  const resultText = document.getElementById('resultText');
  const habit1 = {emoji: '🔥', name: 'Fire Habit'};
  const habit2 = {emoji: '🌊', name: 'Water Habit'};

  // Initially show the two habits (you can dynamically load these)
  document.getElementById('habit1').textContent = habit1.emoji;
  document.getElementById('habit2').textContent = habit2.emoji;

  flipBtn.addEventListener('click', () => {
    resultText.textContent = '';
    flipArea.textContent = '💲';  // Reset coin emoji
    flipArea.classList.add('flipping');
    flipBtn.disabled = true;

    // After 3 seconds, stop animation and show result
    setTimeout(() => {
      flipArea.classList.remove('flipping');
      // Random pick between 0 or 1
      const result = Math.random() < 0.5 ? habit1 : habit2;
      flipArea.textContent = result.emoji;
      resultText.textContent = `The fates have spoken: ${result.name}`;
      flipBtn.disabled = false;
    }, 3000);
  });
</script>

</body>
</html>
